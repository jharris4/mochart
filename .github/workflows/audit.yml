name: Audit

# Scheduled rather than part of CI: a new advisory published against a
# transitive dependency would otherwise fail every open PR for a reason none of
# them introduced. This reports on its own cadence, and can be run on demand.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # The contributor pin; CI's matrix covers the supported range instead.
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: an audit needs the tree resolved, not the packages built
      - run: npm ci --ignore-scripts
      # --omit=dev: vitepress pins vite 5, whose esbuild advisories have no fix until
      # vitepress 2 ships stable. They are dev-server only and never reach a build.
      - run: npm audit --omit=dev --audit-level=high
      # dev dependencies still reported, without failing the job
      - run: npm audit --audit-level=high || true
