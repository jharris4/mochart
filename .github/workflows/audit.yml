name: Audit

# Scheduled rather than part of CI: a new advisory published against a
# transitive dependency would otherwise fail every open PR for a reason none of
# them introduced. This reports on its own cadence, and can be run on demand.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: an audit needs the tree resolved, not the packages built
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
