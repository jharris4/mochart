<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Mochart Charts Demo (Angular)</title>
</head>
<body>
    <noscript>This page requires Javascript to be enabled.</noscript>
    <app-root id="root"></app-root>
    <script>
      // Vite replaces %BASE_URL% at build time. The Angular router derives its
      // base from APP_BASE_HREF (main/index.ts reads import.meta.env.BASE_URL),
      // and this script finishes the GitHub Pages 404 redirect (see
      // scripts/build-pages.mjs) by restoring the originally requested URL
      // before the app boots.
      (function () {
        var base = '%BASE_URL%';
        var redirect = sessionStorage.getItem('mochart:redirect');
        if (redirect !== null) {
          sessionStorage.removeItem('mochart:redirect');
          if (redirect.indexOf(base) === 0) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
    <script type="module" src="/main/index.ts"></script>
</body>
</html>
